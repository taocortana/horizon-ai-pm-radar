theme: jekyll-theme-cayman
title: AI 产品经理情报雷达
description: 面向 AI 产品经理的每日技术、产品、行业与人物观点精选
baseurl: "/horizon-ai-pm-radar"
url: "https://taocortana.github.io"

# Build settings
markdown: kramdown
future: true # Allow future posts to be published
plugins:
  - jekyll-feed
feed:
  path: feed.xml
exclude:
  - ".github"
  - "node_modules"

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "default"
